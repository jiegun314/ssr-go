<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>SS Ready - UDI数据整合工具</title>
<style>
:root{--ready:#DFF6DD;--incomplete:#FDE7E9;--duplicate:#FFF4CE;--conflict:#F4CCCC}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px "Helvetica Neue",Arial,"PingFang SC",sans-serif;background:#F0F0F0;color:#1A1A1A}
/* 布局照搬 ui/forms/main_window.ui：
   frmDataHandling 内是左右两列 —— 左列 frmRawDataImport（内容固定，尽量窄）+
   verticalSpacerImportArea（可伸缩） + frmRecordExport（置底）；
   右列 frmDataConsolidation（按钮行 + 会随窗口扩大的结果表）；
   底部整宽是 gboxOperaitonLog（操作日志）。 */
.app{display:flex;flex-direction:column;height:100%;padding:8px 10px}
.columns{display:flex;gap:8px;flex:1 1 auto;min-height:0}
/* 左列按内容宽度（压缩到最小），右列吃掉所有剩余空间 */
.left{flex:0 0 auto;width:340px;min-width:300px;max-width:45%;display:flex;flex-direction:column;min-height:0}
.left>.spacer{flex:1 1 auto;min-height:12px}
.right{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
section{border:1px solid #C9C9C9;border-radius:4px;background:#FAFAFA;display:flex;flex-direction:column;min-height:0}
section>h2{margin:0;padding:6px 8px;font-size:13px;font-weight:600;border-bottom:1px solid #DCDCDC;background:#F2F2F2}
section>.body{padding:8px;overflow:auto;min-height:0}
.grow{flex:1 1 auto;min-height:0}
.grow>.body{flex:1 1 auto;display:flex;flex-direction:column}
.group{border:1px solid #DDD;border-radius:3px;background:#FFF;margin-bottom:8px}
/* 原界面在「医保代码信息」与下面三组之间有一个 horizontalSpacer：留一个空行 */
.group-gap{height:10px}
.title-row{display:flex;align-items:center;padding:6px 8px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.dot.empty{background:transparent;border:1px solid #B7C0CC}
.dot.imported,.dot.existing{background:#1B7F3B;border:1px solid #A5D6A7}
.dot.failed{background:#A4262C;border:1px solid #F1B0B7}
.actions{display:flex;align-items:center;gap:6px;padding:6px 8px}
.status{flex:1;border:1px solid #B7B7B7;background:#FFF;padding:2px 6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);min-height:20px}
.clean-row{display:flex;justify-content:flex-end;padding:0 2px 2px}
button{font:inherit;padding:3px 8px;border:1px solid #ADADAD;background:#F5F5F5;border-radius:3px;cursor:pointer}
button:disabled{color:#999;cursor:default}
.toolbar{display:flex;align-items:center;gap:8px}
.toolbar .spacer{flex:1}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #D6D6D6;padding:2px 5px;text-align:left;white-space:nowrap}
th{background:#EFEFEF;position:sticky;top:0;z-index:1}
td.MISSING{font-weight:700}
.tblwrap{flex:1 1 auto;min-height:180px;overflow:auto;border:1px solid #D6D6D6;background:#FFF}
.dates{display:flex;flex-direction:row;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
/* 两个日期之间的横线：表示「从…到…」（装饰性，对读屏隐藏） */
.date-sep{flex:0 0 auto;width:16px;height:1px;background:var(--md-on-surface-medium);border-radius:1px}
.dates input[type=date]{flex:1 1 auto;min-width:120px}
.range{display:flex;gap:8px;align-items:center}
/* 记录导出：日期竖排（起始 / 结束），回顾按钮在右侧居中 —— 与 .ui 里的
   dtLogExportStartDate / label_7 / dtLogExportEndDate + verticalSpacer + btnLogExport 一致 */
.range .dates{flex:0 0 auto}
.range .spacer{flex:1 1 auto}
/* 数据回顾窗口的翻页条与导出按钮（每页 100 行） */
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 24px 12px}
.pager-center{display:flex;align-items:center;gap:8px}
#review .pager form{margin:0;padding:0;display:flex}
.pager .page-info{color:var(--md-on-surface-medium);font-size:12px}
.pager .spacer{flex:1 1 auto}
input[type=date],input[type=datetime-local]{font:inherit;padding:2px 4px}
textarea#log{width:100%;height:96px;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;resize:none}
#about-icon{width:40px;height:40px;cursor:pointer;float:right}
dialog{border:1px solid #999;border-radius:4px;padding:12px;max-width:70vw}
#egg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
#egg img{max-width:60%;border-radius:6px;background:#fff}
.busy{opacity:.65;pointer-events:none}

/* 载入图层（Material）：全窗口 scrim + 居中卡片 + M3 不定量圆形进度指示器。
   长任务（导入 / 整合 / 回顾）期间显示，结束后消失。 */
.loading-layer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.32)}
.loading-layer[hidden]{display:none}
.loading-card{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 32px;
  min-width:220px;background:var(--md-surface);border-radius:16px;box-shadow:var(--md-elev-dialog)}
.md-progress{width:48px;height:48px;animation:md-rotate 1.4s linear infinite}
.md-progress .track{stroke:rgba(179,38,30,.12);fill:none;stroke-width:4}
.md-progress .indicator{stroke:var(--md-primary);fill:none;stroke-width:4;stroke-linecap:round;
  stroke-dasharray:1 126;stroke-dashoffset:0;transform-origin:50% 50%;transform:rotate(-90deg);
  animation:md-dash 1.4s ease-in-out infinite}
.loading-text{font-size:13px;line-height:20px;color:var(--md-on-surface-medium)}
@keyframes md-rotate{to{transform:rotate(360deg)}}
@keyframes md-dash{
  0%{stroke-dasharray:1 126;stroke-dashoffset:0}
  50%{stroke-dasharray:90 126;stroke-dashoffset:-35}
  100%{stroke-dasharray:90 126;stroke-dashoffset:-124}
}
@media (prefers-reduced-motion: reduce){.md-progress{animation-duration:4s}}
</style>
<!-- Material Design 主题层：只覆盖视觉（颜色/字体/圆角/阴影/控件外观），
     不改变上面的布局规则（左右两栏比例、分组顺序与空行、置顶/置底与可伸缩空隙）。 -->
<style>
:root{
  /* 单一色相族：品牌红（标题条 #D71600）；动作按钮用同族更深/更浅的色调，
     不再引入第二个强调色（原来是 Material Blue 700，与红色标题条争抢注意力）。 */
  --md-primary:#B3261E;            /* filled 主按钮（白字对比度约 5.9:1） */
  --md-primary-dark:#8C1D18;       /* 主按钮悬停（M3 red 30） */
  --md-on-primary:#FFFFFF;
  --md-secondary-container:#FFDAD6;/* tonal 次按钮底（M3 red 90） */
  --md-on-secondary-container:#8C1D18;
  --md-secondary-hover:#FFC9C3;
  --md-surface:#FFFFFF;
  --md-background:#F5F5F5;         /* Grey 100 */
  --md-on-surface:rgba(0,0,0,.87);
  --md-on-surface-medium:rgba(0,0,0,.60);
  --md-on-surface-disabled:rgba(0,0,0,.38);
  --md-outline:rgba(0,0,0,.12);
  --md-outline-strong:rgba(0,0,0,.24);
  --md-hover:rgba(192,17,11,.06);
  --md-pressed:rgba(192,17,11,.12);
  --md-radius:8px;                 /* 卡片 8dp */
  --md-radius-control:4px;         /* 控件 4dp */
  --md-elev-1:0 1px 2px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  --md-elev-2:0 2px 4px rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.08);
  --md-elev-dialog:0 11px 15px -7px rgba(0,0,0,.20),0 24px 38px 3px rgba(0,0,0,.14);
}
body{
  font-family:Roboto,-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:20px;background:var(--md-background);color:var(--md-on-surface);
  -webkit-font-smoothing:antialiased;
}
/* 区域＝Material 卡片：圆角 + 1dp 抬升，标题按 subtitle-1（14sp/500）；
   标题条用产品指定的红色 #D71600 底 + 白字（数据导入 / 记录导出 / 数据整合 /
   整合结果 / 操作日志 五个区域共用这一条规则）。 */
section{background:var(--md-surface);border:1px solid var(--md-outline);border-radius:var(--md-radius);
  box-shadow:var(--md-elev-1);overflow:hidden}
section>h2{background:#D71600;border-bottom:1px solid #D71600;
  font-size:14px;font-weight:500;letter-spacing:.1px;padding:8px 16px;color:#FFFFFF}
/* 导入分组＝描边卡片（outlined），内部不再叠阴影 */
.group{background:var(--md-surface);border:1px solid var(--md-outline);border-radius:var(--md-radius);
  margin-bottom:8px;box-shadow:none}
.title-row{padding:8px 16px 0}
.title-row>span:last-child{font-size:14px;font-weight:500;letter-spacing:.1px}
.actions{padding:8px 16px 12px;gap:8px}
/* 圆点：直径与四态配色是界面契约（§6.1），此处只加一点轮廓阴影 */
.dot{box-shadow:0 0 0 2px rgba(0,0,0,.02)}
/* 状态标签＝只读的 filled 文本域外观 */
.status{background:rgba(0,0,0,.04);border:none;border-bottom:1px solid var(--md-outline-strong);
  border-radius:var(--md-radius-control) var(--md-radius-control) 0 0;box-shadow:none;
  padding:4px 8px;min-height:24px;color:var(--md-on-surface-medium)}
button{font:inherit;font-size:13px;font-weight:500;letter-spacing:.2px;border:none;background:transparent;
  text-transform:none;   /* 中文不需要大写转换（Material 的 uppercase 只针对拉丁字母） */
  color:var(--md-primary);border-radius:var(--md-radius-control);padding:6px 12px;min-height:32px;
  transition:background-color .15s ease,box-shadow .15s ease}
button:hover:not(:disabled){background:var(--md-hover)}
button:active:not(:disabled){background:var(--md-pressed)}
button:focus-visible{outline:2px solid var(--md-primary);outline-offset:1px}
button:disabled{color:var(--md-on-surface-disabled);background:transparent}
/* 主要动作＝filled button；次要动作＝outlined button（与原按钮一一对应，不新增控件） */
#btn-consolidate,#btn-export{min-height:36px;padding:0 16px;border-radius:var(--md-radius-control);display:inline-flex;align-items:center;gap:8px}
#btn-consolidate{background:var(--md-primary);color:var(--md-on-primary);box-shadow:var(--md-elev-1)}
#btn-export{background:var(--md-secondary-container);color:var(--md-on-secondary-container);box-shadow:none}
#btn-consolidate:hover:not(:disabled){background:var(--md-primary-dark)}
#btn-export:hover:not(:disabled){background:var(--md-secondary-hover);color:var(--md-on-secondary-container)}
.group .actions button[data-action="import"]{border:1px solid var(--md-outline-strong)}
/* Material icon button（M3 extra-small：32dp 容器 + 20dp 图标 + 圆形状态层）。
   三个图标按钮（导入 / 数据回顾 / 清空导入数据）共用这套口径；语义色与布局不变。 */
.icon-btn{
  width:32px;height:32px;min-height:32px;padding:0;border:none;background:transparent;
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:var(--md-on-surface-medium)
}
.icon-btn svg{width:20px;height:20px;fill:currentColor;display:block}
.icon-btn:hover:not(:disabled){background:rgba(192,17,11,.08);color:var(--md-primary)}
.icon-btn:active:not(:disabled){background:var(--md-pressed)}
.icon-btn:focus-visible{outline:2px solid var(--md-primary);outline-offset:1px;border-radius:50%}
.icon-btn:disabled{color:var(--md-on-surface-disabled)}
/* 按钮里的前置图标（Material 允许 filled/tonal 按钮带 leading icon） */
.btn-icon{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
/* 清空按钮原是 outlined 文本按钮，改成 icon button 后不要边框 */
#btn-clean{border:none;color:var(--md-on-surface-medium)}
#btn-clean:hover:not(:disabled){color:#B3261E;background:rgba(179,38,30,.08)}
/* 日期输入＝Material 描边文本域 */
input[type=date]{font:inherit;font-size:13px;padding:6px 8px;min-height:34px;background:var(--md-surface);
  color:var(--md-on-surface);border:1px solid var(--md-outline-strong);border-radius:var(--md-radius-control)}
input[type=date]:focus{outline:none;border-color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-primary)}
/* 数据表＝Material data table：表头 medium、行分隔线、悬停高亮 */
table{font-size:12px;line-height:18px}
th,td{border:none;border-bottom:1px solid var(--md-outline);padding:6px 12px}
th{background:var(--md-surface);font-weight:500;color:var(--md-on-surface-medium);letter-spacing:.4px}
tr:hover td{background:rgba(0,0,0,.03)}
.tblwrap{border:1px solid var(--md-outline);border-radius:var(--md-radius);box-shadow:var(--md-elev-1)}
textarea#log{background:rgba(0,0,0,.03);border:1px solid var(--md-outline);
  border-radius:var(--md-radius-control);padding:8px;color:var(--md-on-surface)}
/* 对话框＝Material dialog：28dp 圆角 + 高抬升 + 背景遮罩 */
dialog{border:none;border-radius:16px;box-shadow:var(--md-elev-dialog);padding:0;max-width:72vw;background:var(--md-surface)}
dialog::backdrop{background:rgba(0,0,0,.32)}
dialog h3{margin:0;padding:16px 24px 8px;font-size:16px;font-weight:500;line-height:24px}
dialog p{margin:0;padding:0 24px 12px;color:var(--md-on-surface-medium);white-space:pre-wrap}
dialog form{display:flex;justify-content:flex-end;gap:8px;padding:8px 16px 16px}
dialog form button{color:var(--md-primary);font-weight:500}
dialog .tblwrap{margin:0 24px 8px}
/* 关于窗口：图标 + 名称 + 一行版本号（commit 与构建时间在版本号的 tooltip 里），
   小对话框、固定内容 —— 与 Qt 版的 AboutWindow 一致 */
.about{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 32px 8px;text-align:center}
.about img{width:48px;height:48px;border-radius:8px;cursor:pointer}
.about .name{font-size:16px;font-weight:500;line-height:24px}
.about .version{color:var(--md-on-surface-medium);font-size:12px;line-height:18px}
/* 说明段：原文是四行（含换行），保留原样换行 */
.about .intro{white-space:pre-wrap;color:var(--md-on-surface-medium);font-size:12px;line-height:18px}
/* 彩蛋窗口：标题 🐶Puppy Approved!🐾 + 图片 */
#egg-dialog img{display:block;max-width:323px;max-height:323px;margin:0 24px 8px;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <div class="columns">
    <div class="left">
      <section style="flex:0 0 auto">
        <h2>数据导入</h2>
        <div class="body">
          <div id="import-area"></div>
        </div>
      </section>
      <div class="spacer"></div>
      <section style="flex:0 0 auto">
        <h2>记录导出</h2>
        <div class="body">
          <div class="range">
            <div class="dates">
              <input type="date" id="start-date" />
              <span class="date-sep" aria-hidden="true"></span>
              <input type="date" id="end-date" />
            </div>
            <span class="spacer"></span>
            <button class="icon-btn" id="btn-review-log" title="回顾" aria-label="回顾">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            </button>
          </div>
        </div>
      </section>
    </div>
    <div class="right">
      <section style="flex:0 0 auto">
        <h2>数据整合</h2>
        <div class="body">
          <div class="toolbar">
            <button id="btn-consolidate">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 20.41L18.41 19 15 15.59 13.59 17 17 20.41zM7.5 8H11v5.59L5.59 19 7 20.41l6-6V8h3.5L12 3.5 7.5 8z"/></svg>数据整合</button>
            <span class="spacer"></span>
            <button id="btn-export">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>生成文件</button>
          </div>
        </div>
      </section>
      <section class="grow">
        <h2>整合结果</h2>
        <div class="body">
          <div class="tblwrap"><table id="result-table"></table></div>
        </div>
      </section>
    </div>
  </div>
  <section style="margin-top:8px;flex:0 0 auto">
    <h2>操作日志</h2>
    <div class="body"><textarea id="log" readonly></textarea></div>
  </section>
</div>

<!-- 载入图层：长任务期间覆盖整个窗口 -->
<div id="loading" class="loading-layer" hidden>
  <div class="loading-card">
    <svg class="md-progress" viewBox="0 0 48 48" role="progressbar" aria-label="正在载入">
      <circle class="track" cx="24" cy="24" r="20"></circle>
      <circle class="indicator" cx="24" cy="24" r="20"></circle>
    </svg>
    <div class="loading-text" id="loading-text"></div>
  </div>
</div>

<dialog id="modal"><h3 id="modal-title"></h3><p id="modal-text"></p><form method="dialog"><button>确定</button></form></dialog>
<dialog id="review">
  <h3 id="review-title"></h3>
  <div class="tblwrap" style="max-height:420px"><table id="review-table"></table></div>
  <div class="pager">
    <button type="button" id="review-export" title="导出当前来源的导入数据">导出</button>
    <div class="pager-center">
      <button type="button" class="icon-btn" id="review-prev" title="上一页" aria-label="上一页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <span class="page-info" id="review-page-info"></span>
      <button type="button" class="icon-btn" id="review-next" title="下一页" aria-label="下一页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>
    <form method="dialog"><button>关闭</button></form>
  </div>
</dialog>

<!-- 关于窗口（菜单「关于」打开）。图标上 5 秒内连点 8 次进入彩蛋。 -->
<dialog id="about">
  <h3>About</h3>
  <div class="about">
    <img id="about-icon" src="logo.png" alt="SingleSourceReady" title="关于" />
    <!-- 以下三段文字与 ui/forms/about_dialog.ui 逐字一致 -->
    <div class="name" id="about-name">SingleSource Ready (SSR)</div>
    <div class="version" id="about-version"></div>
    <div class="intro" id="about-intro">SS Ready provides data validation, cleansing, 
mapping and consolidation capabilities for UDI 
master data preparation for SingleSource.

Developed by
Greater China Supply Chain &amp; RA Team
© 2026 JJMT</div>
  </div>
  <form method="dialog"><button>确定</button></form>
</dialog>

<!-- 彩蛋窗口（原版是独立窗口，标题就是下面这行） -->
<dialog id="egg-dialog">
  <h3>🐶Puppy Approved!🐾</h3>
  <img src="easter_egg.png" alt="🐶Puppy Approved!🐾" />
  <form method="dialog"><button>关闭</button></form>
</dialog>

<script src="app.js"></script>
</body>
</html>
