version: "1.0"

# ─────────────────────────────────────────────────────────────────────────────
# 导入映射：四个来源的 Excel 怎么读进来。改这里就能改导入行为，不用改代码。
#
# 这个文件里只有三类键：
#   1. 导入/整合真正读的：chinese_name / db_field / mandatory_status / value_mapping /
#      required_when（写在 required_if_applicable 的列上）；来源块的 target_table、
#      replace_on_import、preserve_on_cleanup、excel.chinese_header_row、excel.data_start_row。
#   2. 只给样本工厂（ssr-core gensample）用的：列里的 sample.* 子块 ——
#      english_name / data_type / allowed_values。导入、整合、导出都不读它们。
#   3. 没有任何代码读、因此已经删掉的键：aliases、preserve_format、header_match、
#      index_config、description、file_role、global_settings 里的 engine / read_dtype /
#      trim_*。表头匹配只认 chinese_name 的精确值（历史版本里的 aliases 清单可在 git 里找回）。
#
# 两条容易踩的语义（与 README §6 / AGENTS.md R4 一致）：
#   - value_mapping 只归一写法：把某个写法映射成 "" 等于保留原文，不会清空已填内容，
#     所以 NA / Not Applicable 这类占位空值不需要写成映射 —— 条件判断用的空值词表见
#     global_settings.empty_values。
#   - 列的先后顺序＝暂存表的列顺序，别随手挪动。
# ─────────────────────────────────────────────────────────────────────────────

global_settings:
  # mandatory_status 的合法取值
  mandatory_options:
    - "required"
    - "optional"
    - "required_if_applicable"
  # 条件判断（required_when 的 is_empty / is_not_empty 等）眼里的空值；
  # 不用于必填校验：NA / N/A 都是用户填的有效值。
  empty_values:
    - ""
    - null
    - "NA"
    - "N/A"
    - "nan"

# 被多列共用的 value_mapping：列里用 *锚点名 引用，改一处即可全部生效。
shared_mappings:
  udi_yes_no: &udi_yes_no { "N/A": "否", "No": "否", "Not Applicable": "否", "Not launched": "否", "Yes": "是" }
  yes_no_mixed: &yes_no_mixed { "N": "No", "No": "No", "Y": "Yes", "Yes": "Yes", "否": "No", "是": "Yes" }
  yes_no_zh: &yes_no_zh { "否": "No", "是": "Yes" }
  shared_4: &shared_4 { "No": "否", "Yes": "是" }

sources:

  # --------------------------------------------------------------------------
  # ra_input：界面显示「RA信息」（RA Input）
  # 导入写进 ra_input_staging；每次导入重建整张表；启动清理清空这张表
  # --------------------------------------------------------------------------
  ra_input:
    chinese_name: "RA信息"
    display_name: "RA Input"
    target_table: "ra_input_staging"
    replace_on_import: true
    preserve_on_cleanup: false
    excel:
      # 导入真正读的只有 chinese_header_row（当列名）与 data_start_row（第一条数据行）
      sheet_name: "RA Input"
      chinese_header_row: 1
      english_header_row: null
      required_row: null
      data_start_row: 2
      # sheet_name / english_header_row / required_row 只给样本工厂（gensample）用：
      # 样本文件里写工作表名、英文表头行、必填标记行；导入读的是第一个工作表，不看英文行
    columns:

      - chinese_name: "注册证编号/备案凭证编号"
        db_field: "registration_filing_certificate_number"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Registration Filing Certificate Number"
          data_type: "string"

      - chinese_name: "原注册证编号"
        db_field: "original_registration_filing_certificate_number"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Original Registration Filing Certificate Number"
          data_type: "string"

      - chinese_name: "产品名称/通用名称"
        db_field: "product_name"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Product Name / Generic Name"
          data_type: "string"

      - chinese_name: "批准日期"
        db_field: "registration_certificate_approval_date"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Registration Certificate Approval Date"
          data_type: "string"

      - chinese_name: "RA生效日期"
        db_field: "ra_effective_date"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "RA Effective Date"
          data_type: "string"

      - chinese_name: "RA失效日期"
        db_field: "ra_expiration_date"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "RA Expiration Date"
          data_type: "string"

      - chinese_name: "规格型号"
        db_field: "material_code"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Material Code"
          data_type: "string"

      - chinese_name: "医疗器械注册人/备案人名称"
        db_field: "registrant_name"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Registrant Name"
          data_type: "string"

      - chinese_name: "产品描述"
        db_field: "product_description"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Product Description"
          data_type: "string"

      - chinese_name: "是否标记为一次性使用"
        db_field: "if_one_time_use"
        mandatory_status: "required"
        value_mapping: *yes_no_mixed
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If One Time Use"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Y", "N"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "是否为无菌包装"
        db_field: "if_sterilized"
        mandatory_status: "required"
        value_mapping: *yes_no_mixed
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If Sterilized"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Y", "N"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "最大重复使用次数"
        db_field: "max_reuse_count"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Maximum Reuse Count"
          data_type: "string"

      - chinese_name: "使用前是否需要进行灭菌"
        db_field: "if_requires_sterilization_before_use"
        mandatory_status: "required"
        value_mapping: *yes_no_mixed
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If Requires Sterilization Before Use"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Y", "N"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "灭菌方式"
        db_field: "sterilization_method"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Sterilization Method"
          data_type: "string"

      - chinese_name: "器械目录分类编码"
        db_field: "device_catalog_classification_code"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Device Catalog Classification Code"
          data_type: "string"

      - chinese_name: "磁共振（MR）安全相关信息"
        db_field: "mr_safety_information"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "MR Safety Information"
          data_type: "string"

      - chinese_name: "是否与注册/备案产品标识一致"
        db_field: "is_identifier_consistent_with_registered_product"
        mandatory_status: "required"
        value_mapping: *yes_no_mixed
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Is Identifier Consistent With Registered Product"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Y", "N"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "注册/备案产品标识"
        db_field: "registered_product_identifier"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Registered Product Identifier"
          data_type: "string"

      - chinese_name: "原器械目录代码"
        db_field: "original_device_catalog_code"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Original Device Catalog Code"
          data_type: "string"

      - chinese_name: "医疗器械管理类别"
        db_field: "medical_device_management_class"
        mandatory_status: "optional"
        value_mapping: { "第一类": "Class I", "第二类": "Class II", "第三类": "Class III" }
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Medical Device Management Class"
          data_type: "string"
          allowed_values: ["第一类", "第二类", "第三类", "Class I", "Class II", "Class III"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "器械类别"
        db_field: "device_category"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Device Category"
          data_type: "string"

      - chinese_name: "注册/备案人英文名称"
        db_field: "registrant_filing_entity_name_en"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Registrant Filing Entity Name English"
          data_type: "string"

      - chinese_name: "备注"
        db_field: "remarks"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Remarks"
          data_type: "string"

      - chinese_name: "数据维护类型（新增/变更）"
        db_field: "data_maintenance_type"
        mandatory_status: "optional"
        value_mapping: { "新增": "New", "变更": "Change", "New": "New", "Change": "Change" }
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Data Maintenance Type"
          data_type: "string"
          allowed_values: ["新增", "变更", "New", "Change"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "更新描述"
        db_field: "change_description"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Change Description"
          data_type: "string"

  # --------------------------------------------------------------------------
  # global_udi_input：界面显示「UDI团队信息」（Global UDI Input）
  # 导入写进 global_udi_input_staging；每次导入重建整张表；启动清理清空这张表
  # --------------------------------------------------------------------------
  global_udi_input:
    chinese_name: "UDI团队信息"
    display_name: "Global UDI Input"
    target_table: "global_udi_input_staging"
    replace_on_import: true
    preserve_on_cleanup: false
    excel:
      # 导入真正读的只有 chinese_header_row（当列名）与 data_start_row（第一条数据行）
      sheet_name: "Global UDI Input"
      chinese_header_row: 1
      english_header_row: 2
      required_row: 3
      data_start_row: 4
      # sheet_name / english_header_row / required_row 只给样本工厂（gensample）用：
      # 样本文件里写工作表名、英文表头行、必填标记行；导入读的是第一个工作表，不看英文行
    columns:

      - chinese_name: "事业部"
        db_field: "franchise"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Franchise"
          data_type: "string"

      - chinese_name: "业务单元"
        db_field: "operating_company"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Operating Company"
          data_type: "string"

      - chinese_name: "注册证号"
        db_field: "license_no"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "License No."
          data_type: "string"

      - chinese_name: "产品代码"
        db_field: "material_code"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Product Code"
          data_type: "string"

      - chinese_name: "中国市场是否拆包卖"
        db_field: "if_sold_as_individual_units"
        mandatory_status: "required"
        value_mapping: *shared_4
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Sold as Individual Units"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "最小销售单元产品标识"
        db_field: "device_identifier_min_sales_unit"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Device Identifier on Minimum Sales Unit"
          data_type: "string"

      - chinese_name: "发码机构编码名称"
        db_field: "udi_issuing_agency_name"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "UDI Issuing Agency Name"
          data_type: "string"
          allowed_values: ["GS1", "MA", "AHM"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "发布时间"
        db_field: "publish_date"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Publish Date"
          data_type: "string"

      - chinese_name: "最小销售单元中使用单元的数量"
        db_field: "quantity_per_min_sales_unit"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Quantity per Minimum Sales Unit"
          data_type: "string"

      - chinese_name: "使用单元产品标识"
        db_field: "device_identifier_use_unit"
        mandatory_status: "required_if_applicable"
        # 条件必填：条件成立时这一格必须有内容（AND 语义的列表）
        required_when:
          - { "column": "quantity_per_min_sales_unit", "operator": "greater_than", "value": 1, "value_type": "number" }
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Device Identifier on Use Unit"
          data_type: "string"

      - chinese_name: "标识载体"
        db_field: "di_carrier"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "DI Carrier"
          data_type: "string"
          allowed_values: ["一维码", "二维码", "一维码, 二维码"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "是否与注册/备案产品标识一致"
        db_field: "if_consistent_with_registration_di"
        mandatory_status: "required"
        value_mapping: *shared_4
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If Consistent with DI on Registration/Filing"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "注册/备案产品标识"
        db_field: "registration_filing_di"
        mandatory_status: "required_if_applicable"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "DI on Registration/Filing"
          data_type: "string"

      - chinese_name: "是否有本体标识(DM)"
        db_field: "if_direct_marking"
        mandatory_status: "required"
        value_mapping: *udi_yes_no
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If there is Direct Marking(DM)"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Not Applicable", "N/A", "Not launched"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "是否与最小销售单元产品标识一致"
        db_field: "if_dm_identical_to_min_sales_unit_di"
        mandatory_status: "required_if_applicable"
        value_mapping: *udi_yes_no
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If DM is identical with Device Identifier on minimum sales unit"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Not Applicable", "N/A", "Not launched"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "本体产品标"
        db_field: "direct_marking"
        mandatory_status: "required_if_applicable"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Direct Marking"
          data_type: "string"

      - chinese_name: "产品名称/通用名称"
        db_field: "device_generic_name"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Device Name/Generic Name"
          data_type: "string"

      - chinese_name: "商品名称"
        db_field: "product_name"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Product Name"
          data_type: "string"

      - chinese_name: "规格型号"
        db_field: "specification"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Specification"
          data_type: "string"

      - chinese_name: "器械是否为包类产品"
        db_field: "if_kit_product"
        mandatory_status: "required"
        value_mapping: *udi_yes_no
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If it is kit product?"
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Not Applicable", "N/A", "Not launched"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "产品描述"
        db_field: "product_description"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Product Description"
          data_type: "string"

      - chinese_name: "产品货号或编号"
        db_field: "catalogue_code"
        mandatory_status: "optional"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Product Code or Catalogue Code"
          data_type: "string"

      - chinese_name: "器械类别"
        db_field: "device_category"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Device Category"
          data_type: "string"

      - chinese_name: "器械目录分类编码"
        db_field: "classification_code"
        mandatory_status: "required"
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "Classification Code"
          data_type: "string"

      - chinese_name: "生产标识是否包含批号"
        db_field: "if_pi_contains_lot_number"
        mandatory_status: "required"
        value_mapping: *udi_yes_no
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
          english_name: "If Production identifier contains batch/lot no."
          data_type: "string"
          allowed_values: ["是", "否", "Yes", "No", "Not Applicable", "N/A", "Not launched"]   # 样本工厂挑第一个没被映射的写法

      - chinese_name: "生产标识是否包含序列号"
        db_field: "if_pi_contains_serial_number"
        mandatory_status: "required"
        value_mapping: *udi_yes_no
        # 只给样本工厂（gensample）用，导入/整合都不读
        sample:
