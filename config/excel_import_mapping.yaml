version: "1.0"

global_settings:
  engine: "openpyxl"
  read_dtype: "str"
  mandatory_options:
    - required
    - optional
    - required_if_applicable
  trim_header_spaces: true
  trim_cell_spaces: true
  empty_values:
    - ""
    - null
    - "NA"
    - "N/A"
    - "nan"
# empty_values 是“条件判断”的空值词表（required_when 的 is_empty / is_not_empty 等）：
# 来源写 NA 表示这条规则上“没有信息”。它不用于必填校验——required /
# required_if_applicable 的单元格只看用户是否写了内容，NA / N/A 都是有效值。
# value_mapping 只归一写法，不会把写了内容的单元格清空：把某种写法映射成 "" 的条目
# （例如 UDI 来源的 "NA": ""）保留原文，这样必填校验、暂存表和导出看到同一个值。

sources:

# Each source owns the name of the table populated by its import workflow.
# Services that need source tables must read this target_table value instead
# of maintaining a second source-table list in another configuration file.

  ra_input:

