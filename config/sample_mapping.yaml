# 样本工厂（ssr-core gensample）专用的列元数据。
#
# 这里的数据**导入、整合、导出都不读**，只在生成样本工作簿时用来填示例值：
#   english_name    英文表头（样本工作簿的英文表头行）
#   data_type       示例值类型（string 等，决定默认示例值）
#   allowed_values  候选写法（取第一个没被 value_mapping 映射走的当示例值）
#
# 结构：sources.<来源>.<db_field>（db_field 在同一来源内唯一）。
# 这些键原先是平铺在 excel_import_mapping.yaml 每一列的 sample: 子块里 ——
# 拆出来之后，导入映射只剩下运行期真正读的键。loader 会把这里的条目合并回
# 列的 sample 子块，所以 internal/sample 一行都不用改；老配置（带内联
# sample: 子块）也照样能用 —— 见 AGENTS.md §3。
version: "1.0"

