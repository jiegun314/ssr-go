# macOS 与 Windows 的构建 + 发布：tag 触发时出正式产物并挂到 Release。
# 不做 Linux（没有交叉编译，每个平台各自原生构建，见 AGENTS.md §6）。
#
# 分工：日常测试与静态检查在 ci.yml（push main / PR）；本工作流在 PR 上也跑一遍，
# 作为"打包能过"的预演，但只有 tag 才会真正发布。
name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# 发布流水线不能中途取消（避免 Release 出现半套资产），同 ref 排队执行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: 单元测试
        run: go test -count=1 ./...
      - name: 日志列必须与导出模板一致（防止生成物漂移）
        run: go run ./cmd/ssr-core genlogcolumns --check --config config

  build:
    needs: test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号来自 git tag：必须取到完整历史与 tag
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖（React + antd）
        run: npm ci --prefix frontend
      - name: 安装 Wails CLI（版本与 go.mod 对齐，保证构建可复现）
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: 校验版本前置条件（HEAD 有 tag、工作区干净）
        shell: bash
        run: |
          git describe --tags --always --match 'v[0-9]*'
          test -z "$(git status --porcelain)"
      - name: 构建并组装发布包
        # 非 tag 触发（PR / 手动）时允许脏树，本地自测口径与发布一致
        run: go run ./cmd/ssr-core release ${{ startsWith(github.ref, 'refs/tags/') && '' || '--allow-dirty' }}
      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: SingleSourceReady-${{ matrix.platform }}
          path: |
            release/*.zip
            release/SingleSourceReady/VERSION
          if-no-files-found: error

  publish:
    # 只有推 tag 时才发布：创建或更新 Release，并把两个平台的压缩包挂成资产
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -name '*.zip' | sort)
          printf '资产：\n%s\n' "${files[@]}"
          tag="${GITHUB_REF_NAME}"
          title="SingleSourceReady ${tag#v}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag 已存在，更新资产"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" \
              --generate-notes --verify-tag
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
